name: forntend
description: "Employee Attendance & Location System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.2
  latlong2: ^0.10.1
  permission_handler: ^11.4.0
  device_info_plus: ^11.5.0
  connectivity_plus: ^6.1.5
  intl: ^0.20.3
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  table_calendar: ^3.1.3
  shared_preferences: ^2.3.4
  biometric_signature: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/egypt_gas_logo.png
    - assets/egypt_gas_icon_mark.png
    - assets/app_icon.png

flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/egypt_gas_icon_mark.png
  android_12:
    color: "#FFFFFF"
    image: assets/egypt_gas_icon_mark.png